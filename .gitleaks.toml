title = "Family Memory Architecture gitleaks config"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Allow only explicitly marked secret fixtures in the two secret-scan tests"
targetRules = ["generic-api-key", "github-pat", "jwt"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^scripts/tests/(?:test_secret_scan|test_vault_lint)\.py$''',
]
regexes = [
  '''#\s*secret-scan:\s*allow\b''',
]

[[allowlists]]
description = "Skip generated bytecode under scripts/tests/__pycache__"
paths = [
  '''^scripts/tests/__pycache__/.+\.pyc$''',
]
