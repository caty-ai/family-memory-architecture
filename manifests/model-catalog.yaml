# sample family model catalog — non-normative data plane (MoA v2.1)
# Law: family-dev-handbook v0.11.0 L1-10/L1-11. This catalog can neither legalise
# a seat the law forbids nor make usable a model the member cannot verify live.
# Eligibility is won by the member's configuration; seat counts and constraints
# are won by the handbook. No panels are named here; no availability fields exist.
# This public artifact is a sample; real model data belongs on each family's private surface.
revision: 1
date: 2026-08-15
revision_effective_after: 2026-08-22  # staleness bound: selectors fail closed past this on older digests
changelog: >
  r1 (2026-08-15): initial abstract sample publication. Nine placeholder rows
  demonstrate priority and substitute tiers, current and trial states, same-vendor
  escalation, and training-contributor handling. Real model data belongs on each
  family's private surface.
blast_radius: >
  Public sample only — this catalog does not configure real seats or change any
  family deployment. Each family publishes and adopts real data on its private surface.
